spring:
  application:
    name: academic-system

  datasource:
    url: jdbc:postgresql://localhost:5432/academic_system
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

  # === CONFIGURACIÓN SMTP (GMAIL) ===
  # Para Gmail: Generar App Password en Google Account > Security > 2-Step Verification > App Passwords
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:tuemail@gmail.com}
    password: ${MAIL_PASSWORD:xxxx xxxx xxxx xxxx}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:academic-system-secret-key-must-be-at-least-256-bits-long-for-hs256}
  access-token-expiration: 900000      # 15 minutos
  refresh-token-expiration: 604800000  # 7 días

# === CONFIGURACIÓN DE SEGURIDAD ===
security:
  password:
    expiry-days: 90
    min-length: 6
  login:
    max-attempts: 5
    lock-duration-minutes: 30
  rate-limit:
    login-attempts: 10
    recovery-attempts: 3
